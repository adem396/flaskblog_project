{% extends "layout.html" %}
{% from "_fields.html" import field %}
{% block content %}
<section class="panel">
  <form method="POST" action="">
    {{ form.hidden_tag() }}
    <h1 class="form-title">{{ legend }}</h1>
    {{ field(form.title) }}
    {{ field(form.content, rows=12) }}
    {{ form.submit(class='btn') }}
  </form>
</section>
{% endblock %}
